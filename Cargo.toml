[workspace]
resolver = "2"
members = [
  "crates/own-core",
  "crates/device-enroll",
  "crates/access-gate",
  "crates/revoke-list",
  "crates/paid-api",
  "crates/own",
  "crates/golden",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Leif Rydenfalk <59741378+Leif-Rydenfalk@users.noreply.github.com>"]
repository = "https://github.com/ce-net/demo-own-devices-only"

[workspace.dependencies]
# The open capability token: attenuating chains, delegate, authorize, verify_chain.
ce-net-proto = { git = "https://github.com/ce-net/ce-net-proto", rev = "ff449250618cc70bde491055cb97e8ef42121390" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
own-core = { path = "crates/own-core" }
device-enroll = { path = "crates/device-enroll" }
access-gate = { path = "crates/access-gate" }
revoke-list = { path = "crates/revoke-list" }

[profile.release]
debug = false
